# ResolveMeQ Web App (Vite) - Netlify
# Deploy from repo root. Do NOT set "Base directory" in Netlify (leave blank).

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Vite 7 requires Node 20.19+ or 22.12+ (crypto.hash); Node 18 fails builds
  NODE_VERSION = "22"

# Ensure JS is served with correct MIME type (fixes blank page / module script error)
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

# Expose dynamic SEO files on app domain via backend
[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.resolvemeq.net/sitemap.xml"
  status = 200
  force = true

# SPA fallback: serve index.html for all routes so client-side router (e.g. /login, /dashboard) works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
